<!doctype html><html lang="zh-Hant" class="m"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>倉庫層架管理（手機版）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="whcss">
/* Layout: breadcrumb header, zoomable SVG stage on the left, context panel on the right (stacked below on phones) */
:root{
  --bg:#edf1f1; --surface:#ffffff; --ink:#15262b; --muted:#566b71; --line:#cfd9da;
  --water:#1b7f93; --on-water:#ffffff; --water-soft:#d6edf2; --frame:#8197a0; --board:#a9bbc0;
  --zone:#f4f8f8; --sel:#d99a00; --warn:#b45309; --warn-bg:#fdf1de; --ok:#17803d; --pack:#6d4fc2; --carton:#9a6b2f;
  --wall-hi:#e1e9e6; --concrete-hi:#8f8c84; --win-d:#cfe2ee; --wall:#c5d6d3; --wall-d:#a9bfbc; --ceil:#e9ecec; --concrete:#7c7a73; --stain:#6e6556; --win:#eaf4fa;
  --steel:#8da2b3; --steel-d:#60768a; --steel-hi:#b9c8d4; --wood:#9d6c47; --wood-l:#c29669; --wood-d:#76492d; --wood-text:#f6ead8;
  --crate:#2a67cc; --crate-d:#1b4a9c; --crate-2:#6c9bd8; --crate-in:#16396f; --crate-label:#f4f7fb;
  --table:#5b3b2b; --table-d:#432a1e; --table-top:#7d543b;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f181b; --surface:#16242a; --ink:#e4eef0; --muted:#93a8ae; --line:#2b3f46;
    --water:#3bb3c9; --on-water:#06222a; --water-soft:#18363f; --frame:#5d747b; --board:#3e545a;
    --zone:#1b2c32; --sel:#facc15; --warn:#f5a524; --warn-bg:#33260f; --ok:#4ade80; --pack:#a798f0; --carton:#d6a56a;
    --wall-hi:#4a6368; --concrete-hi:#686a62; --win-d:#7a9db3; --wall:#3a5156; --wall-d:#2e4347; --ceil:#27383c; --concrete:#55564f; --stain:#9a8f78; --win:#8fb0c4;
    --steel:#6d8396; --steel-d:#3f5365; --steel-hi:#8fa5b6; --wood:#7a5236; --wood-l:#9a7149; --wood-d:#563520; --wood-text:#f0e2cd;
    --crate:#3b7de0; --crate-d:#24539f; --crate-2:#5a86bf; --crate-in:#102a55; --crate-label:#dfe7f1;
    --table:#4a3022; --table-d:#352117; --table-top:#654431; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f181b; --surface:#16242a; --ink:#e4eef0; --muted:#93a8ae; --line:#2b3f46;
  --water:#3bb3c9; --on-water:#06222a; --water-soft:#18363f; --frame:#5d747b; --board:#3e545a;
  --zone:#1b2c32; --sel:#facc15; --warn:#f5a524; --warn-bg:#33260f; --ok:#4ade80; --pack:#a798f0; --carton:#d6a56a;
    --wall-hi:#4a6368; --concrete-hi:#686a62; --win-d:#7a9db3; --wall:#3a5156; --wall-d:#2e4347; --ceil:#27383c; --concrete:#55564f; --stain:#9a8f78; --win:#8fb0c4;
    --steel:#6d8396; --steel-d:#3f5365; --steel-hi:#8fa5b6; --wood:#7a5236; --wood-l:#9a7149; --wood-d:#563520; --wood-text:#f0e2cd;
    --crate:#3b7de0; --crate-d:#24539f; --crate-2:#5a86bf; --crate-in:#102a55; --crate-label:#dfe7f1;
    --table:#4a3022; --table-d:#352117; --table-top:#654431; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;line-height:1.3}
button:hover{border-color:var(--water)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--water);outline-offset:2px}
button.primary{background:var(--water);border-color:var(--water);color:var(--on-water);font-weight:500}
button.ghost{border-color:transparent;background:transparent}
button.danger{color:var(--warn);border-color:var(--warn)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
input[type=number]{width:5.5em}
select{width:auto}
textarea{resize:vertical;font-family:var(--mono)}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.03em}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;min-width:0;flex:1 1 220px}
.crumbs button{padding:3px 8px;border-color:transparent;background:transparent;color:var(--muted)}
.crumbs button:hover{color:var(--ink);background:var(--water-soft)}
.crumbs button[aria-current=page]{color:var(--ink);font-weight:700}
.crumbs .sep{color:var(--line)}
.search{position:relative;flex:1 1 200px;max-width:340px;min-width:0}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:50vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.results button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 12px}
.results button:last-child{border-bottom:0}
.results .none{padding:10px 12px;color:var(--muted)}
.results small{display:block;color:var(--muted)}
.results .hit{display:flex;border-bottom:1px solid var(--line)}
.results .hit:last-child{border-bottom:0}
.results .hit button{border-bottom:0}
.results .hit>button:first-child{flex:1 1 auto;min-width:0}
.results .hit .hit-open{flex:0 0 auto;width:auto;padding:8px 12px;color:var(--water);font-size:12px;border-left:1px solid var(--line)}
.results em{font-style:normal;font-size:11px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:0 6px;margin-left:6px}
@keyframes iso-flash{0%,100%{filter:none}50%{filter:drop-shadow(0 0 4px #ff9f1a) drop-shadow(0 0 12px #ff7a00) brightness(1.18)}}
#scene[data-m=room] .io.flash{animation:iso-flash .75s ease-in-out infinite}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.sync[data-s=db]::before{background:var(--ok)}
.sync[data-s=local]::before,.sync[data-s=err]::before{background:var(--warn)}

.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:12px}
.stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:0}
#scene{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.hint{position:absolute;left:10px;top:10px;font-size:12.5px;color:var(--muted);pointer-events:none;background:color-mix(in srgb,var(--surface) 88%,transparent);padding:3px 9px;border-radius:6px;max-width:calc(100% - 110px)}
.back{position:absolute;right:10px;top:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;min-height:0}
@media (max-width:820px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(190px,1fr) minmax(0,auto)}
  .panel{max-height:56vh}
}

.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.panel h2{font-size:16px;margin:0}
.panel h3{font-size:13px;margin:16px 0 8px;color:var(--muted);letter-spacing:.06em}
.sub{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.list{display:flex;flex-direction:column;gap:6px;margin:8px 0 0;padding:0;list-style:none}
.list button.row{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;align-items:center}
.list .meta{color:var(--muted);font-size:12.5px;font-family:var(--mono);white-space:nowrap}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pair button{padding:14px 10px;text-align:center}
.pair b{display:block;font-size:15px}
.cfg{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.cfg label,.field label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:auto repeat(var(--cols),minmax(0,1fr));gap:4px;align-items:center}
.grid .rl{font-size:11.5px;color:var(--muted);padding-right:4px;white-space:nowrap}
.cell{aspect-ratio:1;min-width:0;padding:0;border-radius:6px;font-family:var(--mono);font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;overflow:hidden}
.cell .cv{font-size:7.5px;line-height:1.15;letter-spacing:-.2px;text-align:center}
.cell.on{background:var(--water-soft);border-color:var(--water);color:var(--ink);font-weight:500}
.cell.sel{outline:2px solid var(--sel);outline-offset:1px}
.slotform{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--zone);display:flex;flex-direction:column;gap:8px}
.slotform .where{font-weight:700}
.slotform .btns,.additem{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.warn{margin:0;padding:6px 10px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:12.5px}
details{margin-top:10px}
summary{cursor:pointer;color:var(--muted);font-size:12.5px}
details textarea{margin:6px 0}
.items{display:flex;flex-direction:column;gap:6px;margin:0 0 10px;padding:0;list-style:none}
.items li{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.items .kind{flex:none;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--water-soft);color:var(--ink)}
.items .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.items .qty{display:flex;align-items:center;gap:6px;font-family:var(--mono)}
.items .qty button{padding:1px 9px}
.empty{color:var(--muted);font-size:12.5px;margin:0 0 8px}
.additem .f{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.additem .grow{flex:1 1 140px;min-width:0}
.box{margin-bottom:10px;padding:8px;border:1px solid var(--line);border-radius:10px}
.box .bh{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bgrid .side{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.bgrid .lab{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.stackname{margin-top:8px}

/* scene */
.frame{fill:var(--surface);stroke:var(--frame);stroke-width:3}
.board{fill:var(--board)}
.level-bg{fill:transparent}
.zone-bg{fill:color-mix(in srgb,var(--water) calc(var(--f) * 55%),var(--zone));stroke:var(--line);stroke-width:1}
.dot{fill:var(--frame);opacity:.35}
.dot.on{fill:var(--ink);opacity:.85}
.dot.hl{fill:var(--sel);opacity:1;stroke:var(--ink);stroke-width:.6}
.zone.sel .zone-bg{stroke:var(--sel);stroke-width:2.2}
.ztext{font-family:var(--mono);font-size:7.5px;fill:var(--ink)}
.lvl{font-size:7.5px;fill:var(--muted);text-anchor:middle}
.shelf-title,.floor-title{font-size:14px;font-weight:700;fill:var(--ink);font-family:var(--font)}
.floor-bg{fill:var(--zone);stroke:var(--frame);stroke-width:2;stroke-dasharray:6 5}
.sbox{stroke:var(--frame);stroke-width:1}
.sempty{fill:none;stroke:var(--frame);stroke-width:1;stroke-dasharray:3 3}
.slabel{font-size:10px;fill:var(--ink);text-anchor:middle}
.scount{font-size:8.5px;fill:var(--muted);text-anchor:middle;font-family:var(--mono)}
.stk.sel .sempty,.stk.sel .sbox{stroke:var(--sel);stroke-width:2}
#scene[data-v=home] .ztext,#scene[data-v=home] .lvl{opacity:0}
#scene[data-v=home] .shelf,#scene[data-v=floor] .shelf{cursor:pointer}
#scene[data-v=home] .shelf:hover .frame{stroke:var(--water)}
#scene[data-v=home] .floor,#scene[data-v=shelf] .floor,#scene[data-v=level] .floor{cursor:pointer}
#scene[data-v=home] .floor:hover .floor-bg{stroke:var(--water)}
#scene[data-v=shelf] .level{cursor:pointer}
#scene[data-v=shelf] .level:hover .level-bg{fill:var(--water-soft)}
#scene[data-v=level] .zone{cursor:pointer}
#scene[data-v=level] .zone:hover .zone-bg{stroke:var(--water)}
.stk{cursor:pointer}
.stk:hover .sempty{stroke:var(--water)}
.add-btn{cursor:pointer}

/* typed slots, icons, popover */
.ic-meter{color:var(--water)} .ic-pack{color:var(--pack)} .ic-box{color:var(--carton)}
.icn{width:22px;height:22px;flex:none;display:inline-block;vertical-align:middle}
.icn.big{width:46px;height:46px}
.dot.t-meter{fill:var(--water);opacity:.9} .dot.t-pack{fill:var(--pack);opacity:.95} .dot.t-box{fill:var(--carton);opacity:.95}
.zone.dim{opacity:.35}
.slot{cursor:pointer}
.slot-bg{fill:transparent;stroke:var(--line);stroke-width:.25}
.slot:hover .slot-bg{fill:var(--water-soft);stroke:var(--water)}
.slot.sel .slot-bg{fill:var(--water-soft);stroke:var(--sel);stroke-width:.6}
.slot-n{fill:var(--muted);opacity:.5;font-size:2.2px;text-anchor:middle;font-family:var(--mono)}
.slot-l{fill:var(--ink);text-anchor:middle}
.slot-q{fill:var(--ink);font-size:2px;font-family:var(--mono);font-weight:500;text-anchor:end}
.zfoot{font-family:var(--mono);font-size:3.2px;fill:var(--ink)}
.znote{cursor:text}
.znote-bg{fill:transparent;stroke:var(--line);stroke-width:.25;stroke-dasharray:1 .8}
.znote:hover .znote-bg{stroke:var(--water);fill:var(--water-soft)}
.znote-t{font-size:3.2px;fill:var(--ink)}
.znote-t.empty{fill:var(--muted)}
.pop{position:fixed;z-index:40;width:min(310px,calc(100vw - 16px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 12px 32px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:10px}
.pop[hidden]{display:none}
.zone.dim .ztext{opacity:0}
.slot-qb{fill:var(--ink)}
.slot-q{fill:var(--surface)!important;font-size:1.9px!important;text-anchor:middle!important}
.pop form{display:flex;flex-direction:column;gap:10px;margin:0}
.pop-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pop-h b{font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:12.5px}
.seg button[aria-pressed=true]{border-color:var(--water);background:var(--water-soft);font-weight:700}
.pop label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.pop .btns{display:flex;gap:8px;flex-wrap:wrap}
.pv{display:flex;gap:12px;align-items:center;min-width:0}
.pv>div{min-width:0}
.pv-type{font-size:12px;color:var(--muted)}
.pv-text{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.li{display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}

/* room, shelf close view, floor close view */
.sc-bg{fill:var(--wall-d)} .sc-wall{fill:var(--wall)} .sc-base{fill:var(--wall-d)} .sc-floor{fill:var(--concrete)}
.r-ceil{fill:var(--ceil)} .r-wall{fill:var(--wall)} .r-wall.side{fill:var(--wall-d)} .r-floor{fill:var(--concrete)}
.r-stain{fill:var(--stain);opacity:.28}
.r-winf{fill:var(--wood-d)} .r-winp{fill:var(--win)}
.hit{fill:transparent}
.rarea{cursor:pointer} .rarea:hover .hit{fill:var(--water);fill-opacity:.14}
.rshelf,.rstk,.rtable{cursor:pointer}
.rshelf:hover .rs-back{stroke:var(--sel);stroke-width:2.5}
.rtable:hover .table-top{stroke:var(--sel);stroke-width:2}
.rs-back{fill:var(--wood);stroke:var(--steel-d);stroke-width:1}
.rs-side{fill:var(--wood-d)} .rs-beam{fill:var(--steel)} .rs-up{fill:var(--steel-d)}
.rs-badge{fill:var(--crate-label);stroke:var(--steel-d);stroke-width:1.4}
.rs-num{font-weight:700;fill:#17262b;text-anchor:middle}
.rs-empty{fill:none;stroke:var(--steel-d);stroke-width:1.2;stroke-dasharray:4 3;opacity:.7}
.table-top{fill:var(--table-top)} .table{fill:var(--table)} .table-d{fill:var(--table-d)}
.r-label{fill:var(--ink);font-weight:700;text-anchor:middle;paint-order:stroke;stroke:var(--wall);stroke-width:4px;stroke-linejoin:round;pointer-events:none;opacity:.9}
.f-shadow{fill:#000;opacity:.2}
.f-back{fill:var(--wood)} .f-board{fill:var(--wood-l)}
.f-beam{fill:var(--steel)} .f-beam-hi{fill:var(--steel-hi);opacity:.8}
.f-up{fill:var(--steel);stroke:var(--steel-d);stroke-width:.6}
.f-hole{fill:var(--steel-d);opacity:.65}
.lvl{fill:var(--wood-text);opacity:.85}
.zone-bg{fill-opacity:.93}
.floor-empty{font-size:16px;fill:var(--ink);opacity:.75}
.cr-a{fill:var(--crate);stroke:var(--crate-d);stroke-width:1}
.cr-b{fill:var(--crate-2);stroke:var(--crate-d);stroke-width:1}
.cr-top{fill:var(--crate-2);stroke:var(--crate-d);stroke-width:1}
.cr-slot{fill:var(--crate-in);opacity:.85}
.cr-label{fill:var(--crate-label)}
.cr-cell{fill:var(--crate-in)} .cr-cell.sel{stroke:var(--sel);stroke-width:1.6}
.stk-sel{fill:none;stroke:var(--sel);stroke-width:2.5;display:none}
.stk.sel .stk-sel{display:inline}
.stk .sempty{stroke:var(--steel-d)}
.stk .slabel{fill:var(--ink);font-weight:700;text-anchor:middle}
.stk .scount{fill:var(--ink);opacity:.8}

.navarrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:58px;height:70px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;background:color-mix(in srgb,var(--surface) 92%,transparent);box-shadow:0 2px 10px rgba(0,0,0,.18);font-size:12px;color:var(--ink)}
.navarrow[hidden]{display:none}
.navarrow svg{width:26px;height:26px}
.navarrow.prev{left:10px} .navarrow.next{right:10px}
@media (max-width:820px){.navarrow{width:46px;height:56px}.navarrow svg{width:22px;height:22px}}
.fl-grid{fill:none;stroke:#000;stroke-opacity:.07;stroke-width:1.2}
.fl-badge{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.fl-badge-t{fill:var(--surface);font-weight:700;font-size:11px;text-anchor:middle}
.cr-num{font-family:var(--mono);font-size:9px;fill:#e8f0ff}
.cr-cell{cursor:pointer}
@keyframes fadein{from{opacity:.15}to{opacity:1}}
#scene.fadein{animation:fadein .3s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* game-style room */
.r-ceil2{fill:url(#g-ceil2)} .r-wall2{fill:url(#g-wall)} .r-side2{fill:url(#g-side)} .r-side2r{fill:url(#g-sideR)} .r-floor2{fill:url(#g-floor2)}
.r-dado{fill:#5f7f80;opacity:.34} .r-fstain{fill:#3d3a33;opacity:.16} .r-light{fill:#fff;opacity:.07}
.r-beam{fill:var(--wall-d);opacity:.8} .r-lamp{fill:#f6fbff;opacity:.95}
.sh-shadow{fill:#10140f;opacity:.15;pointer-events:none}
.rs-back{fill:var(--wood);stroke:none} .rs-in{fill:#2b1608;opacity:.22}
.rs-beam{fill:var(--steel);stroke:var(--steel-d);stroke-width:.6} .rs-hi{fill:var(--steel-hi);opacity:.8}
.rs-hole{fill:#2a3238;opacity:.75}

    const t = e.target.closest('[data-stack]'); if (!t) return;
